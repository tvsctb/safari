name: ar-rmt-terminal-off-targetsg-on-20260817-v1
description: Full six-seed AR RMT terminal-off and memory-target-SG comparison
resources:
  cluster: yonsei-ai-gpu
  preset: gpu-2
image: ghcr.io/tvsctb/safari-aux:torch2.3.1-v3
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
run:
  - command: |-
      set -euo pipefail
      git clone --branch aux-experiments --single-branch https://github.com/tvsctb/safari.git /workspace/safari
      cd /workspace/safari
      git checkout --detach b94e99422df6e416ff804685f2df00348d89c851
      test "$(git rev-parse HEAD)" = "b94e99422df6e416ff804685f2df00348d89c851"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ')" = "2"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | grep -c 'RTX 3090')" = "2"
      python -m unittest tests.test_aux_models tests.test_rmt_loss_analysis tests.test_ar_rmt_scale_study
      python scripts/run_ar_rmt_terminal_off_sgon.py \
        --output-root /output/ar-rmt-terminal-off-targetsg-on-20260817-v1 \
        --gpu-ids 0,1 \
        --workers-per-gpu 8 \
        --wandb-project aux-assc-recall \
        --wandb-entity bjjin07-x \
        --wandb-group ar-rmt-terminal-off-targetsg-on-20260817-v1
    workdir: /workspace
