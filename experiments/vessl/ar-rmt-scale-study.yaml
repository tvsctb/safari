name: ar-rmt-noaux-targetsg-scale-20260817-v1
description: Single-run automated no-AUX and target-SG RMT scale study
resources:
  cluster: yonsei-ai-gpu
  preset: gpu-8
image: ghcr.io/tvsctb/safari-aux:torch2.3.1-v3
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
run:
  - command: |-
      set -euo pipefail
      git clone --branch aux-experiments --single-branch https://github.com/tvsctb/safari.git /workspace/safari
      cd /workspace/safari
      git checkout --detach eee7329b077f7597041af92d6b94547e8012c474
      test "$(git rev-parse HEAD)" = "eee7329b077f7597041af92d6b94547e8012c474"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ')" = "8"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | grep -c 'RTX 3090')" = "8"
      python -m unittest tests.test_aux_models tests.test_rmt_loss_analysis tests.test_ar_rmt_scale_study
      python scripts/run_ar_rmt_scale_study.py \
        --output-root /output/ar-rmt-noaux-targetsg-scale-20260817-v1 \
        --gpu-ids 0,1,2,3,4,5,6,7 \
        --workers-per-gpu 4 \
        --wandb-project aux-assc-recall \
        --wandb-entity bjjin07-x \
        --wandb-group ar-rmt-noaux-targetsg-scale-20260817-v1
    workdir: /workspace
