name: ar-irnn-difficulty-ladder-20260820-v1
description: No-AUX-selected association-load ladder with held-out iRNN AUX comparison
resources:
  cluster: yonsei-ai-gpu
  preset: gpu-2
image: ghcr.io/tvsctb/safari-aux:torch2.3.1-v3
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
run:
  - command: |-
      set -euo pipefail
      git clone --branch aux-experiments --single-branch https://github.com/tvsctb/safari.git /workspace/safari
      cd /workspace/safari
      git checkout --detach 2269386
      test "$(git rev-parse HEAD)" = "2269386c0455094d0b6c2823c652a91f5acded89"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ')" = "2"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | grep -c 'RTX 3090')" = "2"
      PYTHONPATH=.:scripts python -m unittest \
        tests.test_rnn_aux \
        tests.test_ar_rnn_study \
        tests.test_assoc_recall_active_associations \
        tests.test_controlled_assoc_recall \
        tests.test_ar_rnn_controlled_lag_study \
        tests.test_ar_irnn_difficulty_ladder_study
      PYTHONPATH=.:scripts python scripts/run_ar_irnn_difficulty_ladder_study.py \
        --output-root /output/ar-irnn-difficulty-ladder-20260820-v1 \
        --gpu-ids 0,1 \
        --workers-per-gpu 8 \
        --wandb-project aux-assc-recall \
        --wandb-entity bjjin07-x \
        --screen-training-group ar-irnn-difficulty-screen-train-20260820-v1 \
        --screen-eval-group ar-irnn-difficulty-screen-eval-20260820-v1 \
        --heldout-training-group ar-irnn-difficulty-heldout-train-20260820-v1 \
        --heldout-eval-group ar-irnn-difficulty-heldout-eval-20260820-v1 \
        --examples-per-lag 10000 \
        --base-batch-size 128 \
        --dataset-seed 20260820
    workdir: /workspace
