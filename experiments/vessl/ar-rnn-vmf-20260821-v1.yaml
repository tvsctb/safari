name: ar-rnn-vmf-20260821-v1
description: Separate GG versus whole-state VV fixed/learned-kappa tanh/iRNN study
resources:
  cluster: yonsei-ai-gpu
  preset: gpu-2
image: ghcr.io/tvsctb/safari-aux:torch2.3.1-v3
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
run:
  - command: |-
      set -euo pipefail
      git clone --branch aux-experiments --single-branch https://github.com/tvsctb/safari.git /workspace/safari
      cd /workspace/safari
      git checkout --detach 1501eff34ad4c00b5d153f383862e64a19d2eb27
      test "$(git rev-parse HEAD)" = "1501eff34ad4c00b5d153f383862e64a19d2eb27"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ')" = "2"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | grep -c 'RTX 3090')" = "2"
      PYTHONPATH=.:scripts python -m unittest \
        tests.test_rnn_aux \
        tests.test_aux_models \
        tests.test_ar_rnn_study \
        tests.test_ar_rnn_controlled_lag_study \
        tests.test_ar_rnn_vmf_study \
        tests.test_assoc_recall_active_associations \
        tests.test_controlled_assoc_recall
      PYTHONPATH=.:scripts python scripts/run_ar_rnn_vmf_study.py \
        --output-root /output/ar-rnn-vmf-20260821-v1 \
        --gpu-ids 0,1 \
        --workers-per-gpu 8 \
        --wandb-project aux-assc-recall \
        --wandb-entity bjjin07-x \
        --group-prefix ar-rnn-vmf-20260821-v1 \
        --examples-per-lag 10000 \
        --base-batch-size 128 \
        --dataset-seed 20260821
    workdir: /workspace
