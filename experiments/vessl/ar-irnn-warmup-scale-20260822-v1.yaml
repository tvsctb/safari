name: ar-irnn-warmup-scale-20260822-v1
description: Fully automated K5 iRNN common-warmup learned Gaussian-scale study
resources:
  cluster: yonsei-ai-gpu
  preset: gpu-2
image: ghcr.io/tvsctb/safari-aux:torch2.3.1-v3
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
run:
  - command: |-
      set -euo pipefail
      git clone --branch aux-experiments --single-branch https://github.com/tvsctb/safari.git /workspace/safari
      cd /workspace/safari
      git checkout --detach a3eea16
      test "$(git rev-parse HEAD)" = "a3eea16dd67a841ab9ef322d5df0705a85a7e5c5"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ')" = "2"
      test "$(nvidia-smi --query-gpu=name --format=csv,noheader | grep -c 'RTX 3090')" = "2"
      PYTHONPATH=.:scripts python -m unittest \
        tests.test_rnn_aux \
        tests.test_ar_rmt_scale_study \
        tests.test_ar_rnn_study \
        tests.test_assoc_recall_active_associations \
        tests.test_controlled_assoc_recall \
        tests.test_ar_rnn_controlled_lag_study \
        tests.test_ar_irnn_warmup_scale_study
      PYTHONPATH=.:scripts python scripts/run_ar_irnn_warmup_scale_study.py \
        --output-root /output/ar-irnn-warmup-scale-20260822-v1 \
        --gpu-ids 0,1 \
        --workers-per-gpu 8 \
        --wandb-project aux-assc-recall \
        --wandb-entity bjjin07-x \
        --group-prefix ar-irnn-warmup-scale-20260822-v1 \
        --examples-per-lag 10000 \
        --base-batch-size 128 \
        --dataset-seed 20260822 \
        --calibration-examples 2048
      touch /output/AR_IRNN_WARMUP_SCALE_COMPLETE
    workdir: /workspace
