learning_rate_monitor:
  logging_interval: ${train.interval}

timer:
  step: true
  inter_step: false
  epoch: true
  val: true

params:
  total: true
  trainable: true
  fixed: true

model_checkpoint:
  monitor: ${train.monitor}
  mode: ${train.mode}
  save_top_k: 1
  save_last: true
  dirpath: checkpoints/
  filename: best
  auto_insert_metric_name: false
  verbose: true

study_summary:
  result_path: ???

rnn_scale_crossfade:
  enabled: false
  start_step: 0
  transition_steps: 12560
  target_lr_initial: 1e-3
  target_lr_final: 0.0
  gaussian_lr_initial: 0.0
  gaussian_lr_final: 1e-4
  log_interval: 157
