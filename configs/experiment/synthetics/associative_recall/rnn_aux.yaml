# @package _global_
defaults:
  - /experiment/synthetics/associative_recall/base.yaml

dataset:
  return_aux_tokens: true
  loader_seed: null

model:
  _name_: rnn_aux_lm
  d_model: 64
  n_layer: 3
  vocab_size: ${dataset.vocab_size}
  chunk_size: 4
  aux_chunk_sizes: null
  chunk_offset: random
  dropout: 0.0
  activation: tanh
  recurrent_init: orthogonal
  recurrent_identity_scale: 1.0
  rho: 1.0
  tau: 1.0
  gaussian_scale_mode: fixed
  gaussian_scale_learning_start_step: 0
  gaussian_scale_learning_rate: 1e-5
  memory_scale_target: null
  memory_scale_target_mode: fixed
  memory_scale_target_learning_rate: 1e-3
  memory_scale_constraint_weight: 0.0
  memory_scale_constraint_start_step: null
  memory_scale_constraint_ramp_steps: 0
  state_aux_distribution: gaussian
  vmf_kappa_mode: fixed
  memory_vmf_kappa: 1.0
  terminal_vmf_kappa: 1.0
  auxiliary_probe_only: false
  stop_gradient_memory_target: false
  stop_gradient_memory_observation: false
  memory_observation_gradient_scale: 1.0
  use_chunk_loss: true
  use_discrete_loss: true
  use_memory_loss: true
  exclude_initial_memory_reconstruction: true
  use_terminal_loss: true
  condition_memory_reconstruction_on_boundary: false

task:
  _name_: aux_lm
  loss: cross_entropy
  aux_weight: 0.1
  aux_weight_schedule: fixed
  aux_weight_final: 0.1
  aux_weight_decay_start_step: 0
  aux_weight_decay_end_step: 1
  aux_activation_lm_loss_threshold: null
  aux_activation_lm_loss_ema_beta: 0.99
  aux_solved_ce_threshold: null
  aux_solved_ce_ema_beta: 0.99
  aux_post_solve_weight: 0.1
  aux_post_solve_adaptive_end_step: null
  aux_post_solve_hold_steps: 0
  aux_post_solve_decay_steps: 1
  aux_component_weights: {}
  aux_component_weights_final: {}
  aux_gradient_norm_interval: 0
  aux_gradient_norm_steps: []
  aux_diagnostic_interval: 50
  torchmetrics: ['perplexity']
  metrics: ['accuracy_ignore_index']

train:
  global_batch_size: 32
  fused_adamw: true
  log_model_metrics_on_step: false

trainer:
  gradient_clip_val: 1.0

optimizer:
  lr: 1e-3
  weight_decay: 0.1

scheduler:
  num_warmup_steps: ${eval:${div_up:${dataset.__train_len}, ${train.global_batch_size}} * ${div_up:${trainer.max_epochs}, 5}}

wandb:
  project: assoc-recall-rnn-aux
