# @package _global_
defaults:
  - /experiment/synthetics/associative_recall/base.yaml

dataset:
  return_aux_tokens: true
  # Optional independent seed for shuffled training-batch order.
  loader_seed: null

model:
  _name_: rmt_aux_lm
  # Match the repository Transformer baseline's width and depth by default.
  d_model: 32
  n_layer: 2
  d_inner: 128
  n_heads: 1
  vocab_size: ${dataset.vocab_size}
  chunk_size: 4
  num_memory_tokens: 2
  dropout: 0.0
  use_chunk_loss: true
  use_discrete_loss: true
  use_memory_loss: true
  # Neutral center of the architecture-specific rho pressure screen.
  rho: 31.622777
  stop_gradient_memory_target: false
  stop_gradient_memory_observation: false
  memory_observation_gradient_scale: 1.0
  reconstruct_initial_memory: true
  use_terminal_loss: true
  # Neutral center of the architecture-specific tau pressure screen.
  tau: 11.925695
  learnable_terminal_target: true

task:
  _name_: aux_lm
  loss: cross_entropy
  aux_weight: 0.1
  aux_weight_schedule: fixed  # fixed | linear | cosine
  aux_weight_final: 0.1
  aux_weight_decay_start_step: 0
  aux_weight_decay_end_step: 1
  # Optional one-way gate: hold AUX at zero until the EMA training LM loss
  # reaches this threshold, then start the schedule above from step zero.
  aux_activation_lm_loss_threshold: null
  aux_activation_lm_loss_ema_beta: 0.99
  # Optional one-way post-solve schedule: once both inverse token CEs have an
  # EMA below the threshold, decay the overall AUX weight to the target.
  aux_solved_ce_threshold: null
  aux_solved_ce_ema_beta: 0.99
  aux_post_solve_weight: 0.1
  aux_post_solve_adaptive_end_step: null
  aux_post_solve_hold_steps: 0
  aux_post_solve_decay_steps: 1
  # Sparse component multipliers; omitted entries default to 1.0. Both maps use
  # the same schedule and step interval as aux_weight.
  aux_component_weights: {}
  aux_component_weights_final: {}
  # 0 disables extra autograd passes; use the number of train batches for once/epoch.
  aux_gradient_norm_interval: 0
  # Optional exact optimizer-batch indices for sparse gradient diagnostics.
  aux_gradient_norm_steps: []
  # Detached reconstruction diagnostics can be sampled without changing loss.
  # Keep 1 for legacy behavior; larger intervals reduce tiny-kernel/logging cost.
  aux_diagnostic_interval: 50
  torchmetrics: ['perplexity']
  metrics: ['accuracy_ignore_index']

train:
  # The synthetic RMT fits without activation checkpointing. Fused AdamW is
  # the language-experiment execution optimization that preserves the update.
  global_batch_size: 32
  fused_adamw: true
  log_model_metrics_on_step: false

optimizer:
  lr: 1e-3
  weight_decay: 0.1

scheduler:
  # 20% linear warmup for the default 400-epoch associative-recall recipe.
  num_warmup_steps: ${eval:${div_up:${dataset.__train_len}, ${train.global_batch_size}} * ${div_up:${trainer.max_epochs}, 5}}

wandb:
  project: assoc-recall-rmt-write-memory
