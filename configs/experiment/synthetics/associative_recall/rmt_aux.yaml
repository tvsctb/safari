# @package _global_
defaults:
  - /experiment/synthetics/associative_recall/base.yaml

dataset:
  return_aux_tokens: true

model:
  _name_: rmt_aux_lm
  d_model: 64
  n_layer: 2
  d_inner: 256
  n_heads: 4
  vocab_size: ${dataset.vocab_size}
  # Report options: boundary_reverse | role_reverse | role_forward
  token_scheme: boundary_reverse
  chunk_size: 4
  num_memory_tokens: 4
  dropout: 0.0
  share_inverse: true
  share_inverse_embedding: true
  share_inverse_head: true
  # Boundary-scheme switch; independent of parameter sharing.
  use_direction_embedding: true
  scale_mode: fixed
  # global | slotwise
  scale_granularity: global
  rho: 1.0
  tau: 1.0
  min_scale: 1e-4
  max_scale: 1e4

task:
  _name_: aux_lm
  loss: cross_entropy
  aux_weight: 0.1
  torchmetrics: ['perplexity']
  metrics: ['accuracy_ignore_index']
