# @package _global_
defaults:
  - /experiment/synthetics/associative_recall/base.yaml

dataset:
  return_aux_tokens: true

model:
  _name_: rmt_aux_lm
  # Match the repository Transformer baseline's width and depth by default.
  d_model: 32
  n_layer: 2
  d_inner: 128
  n_heads: 1
  vocab_size: ${dataset.vocab_size}
  # Report options: boundary_reverse | role_reverse | role_forward
  token_scheme: boundary_reverse
  chunk_size: 4
  num_memory_tokens: 4
  dropout: 0.0
  share_inverse: true
  share_inverse_embedding: true
  share_inverse_head: true
  # Boundary-scheme switch; independent of parameter sharing.
  use_direction_embedding: true
  # Global transition perturbations. Generation noise propagates forward;
  # observation noise is visible only to the inverse path.
  generation_noise_std: 0.0
  observation_noise_std: 0.0
  use_chunk_loss: true
  use_discrete_loss: true
  use_memory_loss: true
  memory_scale_mode: fixed
  memory_scale_granularity: global  # global | slotwise
  rho: 1.0
  memory_min_scale: 1e-4
  memory_max_scale: 1e4
  stop_gradient_memory_target: false
  use_terminal_loss: true
  terminal_scale_mode: fixed
  terminal_scale_granularity: global  # global | slotwise
  tau: 10.0
  terminal_min_scale: 1e-4
  terminal_max_scale: 1e4
  learnable_terminal_target: false
  use_terminal_chunk: true
  use_terminal_chunk_loss: true

task:
  _name_: aux_lm
  loss: cross_entropy
  aux_weight: 0.1
  aux_weight_schedule: fixed  # fixed | linear | cosine
  aux_weight_final: 0.1
  aux_weight_decay_start_step: 0
  aux_weight_decay_end_step: 1
  # 0 disables extra autograd passes; use the number of train batches for once/epoch.
  aux_gradient_norm_interval: 0
  torchmetrics: ['perplexity']
  metrics: ['accuracy_ignore_index']
