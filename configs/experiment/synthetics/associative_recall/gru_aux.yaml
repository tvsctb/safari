# @package _global_
defaults:
  - /experiment/synthetics/associative_recall/base.yaml

model:
  _name_: gru_aux_lm
  d_model: 32
  n_layer: 2
  vocab_size: ${dataset.vocab_size}
  chunk_size: 4
  dropout: 0.0
  random_chunk_offset: true
  share_inverse: true

task:
  _name_: aux_lm
  loss: cross_entropy
  aux_weight: 1.0
  torchmetrics: ['perplexity']
  metrics: ['accuracy_ignore_index']
